<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10243c">
<title>Solara Energia | Gestão Solar</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#172b4d;--muted:#68778d;--line:#e4eaf2;--green:#16865b;--greenbg:#e7f7ef;--lime:#c7f36b;--nav:#10243c;--red:#bd3d46;--shadow:0 8px 28px #1d35570a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top left,#dff3ce,transparent 45%),var(--bg)}.login-card{width:min(440px,100%);background:#fff;padding:32px;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px #1d355712}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:21px}.logo{width:36px;height:36px;border-radius:10px;background:var(--lime);color:var(--nav);display:grid;place-items:center;font-size:22px}.login-card h1{margin:20px 0 4px;font-size:26px}.muted{color:var(--muted)}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-size:12px;font-weight:750;color:#46566d}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:700;color:var(--ink)}.btn.primary{background:#173e31;color:#fff;border-color:#173e31}.btn.lime{background:var(--lime);border-color:var(--lime)}.error{color:var(--red);font-size:13px;min-height:1em}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--nav);color:#eaf0fa;padding:22px 15px;display:flex;flex-direction:column;gap:22px}.tenant{padding:13px;border:1px solid #ffffff25;border-radius:12px;color:#dbe5f4;overflow-wrap:anywhere}.tenant small{display:block;color:#9db0c9;font-size:10px;letter-spacing:1px;margin-bottom:5px}.nav-label{font-size:10px;color:#8195b1;letter-spacing:1.4px;padding:0 10px;margin-bottom:6px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b9c8dc;text-align:left;padding:11px 12px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff}.sidefoot{margin-top:auto;color:#93a6bf;font-size:12px;padding:8px}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.who{display:flex;align-items:center;gap:12px}.content{padding:26px 28px;max-width:1450px;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}.eyebrow{font-size:11px;color:var(--green);letter-spacing:1.3px;text-transform:uppercase;font-weight:800}.h1{font-size:27px;letter-spacing:-.7px;margin:4px 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:17px}.metric-label{color:var(--muted);font-size:12px}.metric-value{font-size:26px;font-weight:850;margin:12px 0 3px;letter-spacing:-.5px}.panel{padding:19px;margin-bottom:16px}.panel h2{font-size:15px;margin:0 0 12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.field{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white;color:var(--ink);min-width:170px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf1f6}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--greenbg);color:var(--green);font-size:11px;font-weight:750}.empty{padding:28px;text-align:center;color:var(--muted)}.note{padding:12px 14px;background:#f0f7e7;border:1px solid #deedc9;border-radius:10px;color:#35571d;font-size:12px;margin-bottom:16px}.modal-backdrop{position:fixed;inset:0;background:#10243c88;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);background:#fff;border-radius:16px;padding:24px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0}.close{border:0;border-radius:8px;background:#f1f4f8;width:34px;height:34px}.toast{position:fixed;bottom:20px;right:20px;background:#173e31;color:#fff;padding:13px 17px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}.mobile-menu{display:none}
@media(max-width:950px){.app{grid-template-columns:205px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px 16px}.topbar{padding:0 16px}}
@media(max-width:680px){.app{display:block}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:8;inset:0 auto 0 0;width:260px}.content{padding:18px 12px}.topbar{height:60px;padding:0 12px}.mobile-menu{display:inline-block}.cards{gap:8px}.metric{padding:12px}.metric-value{font-size:22px}.h1{font-size:23px}.head{align-items:center}.field{flex:1;min-width:130px}}
</style>
</head>
<body>
<section id="login-view" class="login"><div class="login-card"><div class="brand" style="color:#172b4d"><div class="logo">☀</div>solara <span style="font-size:10px;color:#16865b;align-self:flex-start">ENERGIA</span></div><h1>Acesse sua plataforma</h1><p class="muted">Entre com seu e-mail e senha cadastrados na Solara.</p><form id="login-form" class="form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" id="forgot">Esqueci minha senha</button><div id="login-error" class="error" role="alert"></div></form><p class="muted" style="font-size:12px;margin-top:18px">Acesso protegido por autenticação.</p></div></section>
<div id="app-view" class="app hidden">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">☀</div>solara</div><div class="tenant"><small>EMPRESA</small><strong id="company-name">Carregando...</strong><div id="user-role" style="font-size:11px;color:#9db0c9;margin-top:5px"></div></div>
<div><div class="nav-label">GESTÃO</div><nav id="nav" class="nav">
<button class="active" data-page="dashboard">▦ &nbsp; Visão geral</button><button data-page="customers">♙ &nbsp; Clientes</button><button data-page="plants">☀ &nbsp; Usinas</button><button data-page="bills">▤ &nbsp; Faturas</button><button data-page="generation">◉ &nbsp; Geração</button><button data-page="tickets">◉ &nbsp; Chamados</button><button data-page="leads">↗ &nbsp; CRM / Leads</button><button data-page="reports">▥ &nbsp; Relatórios</button><button data-page="settings">⚙ &nbsp; Configurações</button>
</nav></div><div class="sidefoot">© 2026 Solara Energia<br>Gestão inteligente de energia</div></aside>
<main class="main"><header class="topbar"><div><button class="btn mobile-menu" id="mobile-menu">☰</button> <small id="breadcrumb">Workspace / Visão geral</small></div><div class="who"><span id="user-email" class="muted"></span><button class="btn" id="logout">Sair</button></div></header><div id="content" class="content"><div class="panel">Carregando seus dados...</div></div></main></div>
<div id="modal-backdrop" class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 id="modal-title">Novo cadastro</h2><button class="close" id="modal-close">✕</button></div><form id="record-form" class="form"><div id="form-fields" class="form"></div><div id="form-error" class="error"></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="modal-cancel" type="button">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div><div id="toast" class="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
/* Configure estes dois valores com os dados do seu projeto Supabase.
   A chave publishable/anon pode ficar no navegador; NUNCA use service_role aqui. */
const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'SUA_CHAVE_PUBLISHABLE';
const configured = !SUPABASE_URL.includes('SEU-PROJETO') && !SUPABASE_PUBLISHABLE_KEY.includes('SUA_CHAVE');
const supabase = createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let user=null,profile=null,company=null,page='dashboard',search='',currentType=null;
const cache={customers:[],plants:[],generation:[],bills:[],tickets:[],leads:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>Number(n||0).toLocaleString('pt-BR');
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
function err(id,msg){$(id).textContent=msg||''}
function setLoggedIn(on){$('login-view').classList.toggle('hidden',on);$('app-view').classList.toggle('hidden',!on)}
function date(v){return v?new Date(v.length===10?v+'T00:00:00':v).toLocaleDateString('pt-BR'):'—'}
function status(v){const labels={active:'Ativo',inactive:'Inativo',pending:'Pendente',maintenance:'Manutenção',open:'Aberto',in_progress:'Em atendimento',waiting_customer:'Aguardando cliente',resolved:'Resolvido',closed:'Fechado',new:'Novo',contacted:'Contatado',qualified:'Qualificado',proposal:'Proposta',won:'Ganho',lost:'Perdido'};return `<span class="pill">${esc(labels[v]||v||'—')}</span>`}
function pageHead(kicker,title,desc,action=''){return `<div class="head"><div><div class="eyebrow">${kicker}</div><h1 class="h1">${title}</h1><p class="muted">${desc}</p></div>${action?`<button class="btn lime" data-new="${action}">＋ Novo cadastro</button>`:''}</div>`}
async function boot(){
 if(!configured){setLoggedIn(false);err('login-error','Configure SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no arquivo index.html antes de publicar.');return}
 const {data:{session},error}=await supabase.auth.getSession();
 if(error){err('login-error',error.message);return}
 if(session){user=session.user;await loadProfileAndApp()}else setLoggedIn(false);
}
async function loadProfileAndApp(){
 setLoggedIn(true);$('user-email').textContent=user.email||'';$('content').innerHTML='<div class="panel">Validando perfil...</div>';
 const {data:p,error:pe}=await supabase.from('profiles').select('id,company_id,full_name,role').eq('id',user.id).maybeSingle();
 if(pe||!p){await supabase.auth.signOut();setLoggedIn(false);err('login-error','Perfil não encontrado ou sem permissão. Peça ao administrador para vincular sua conta.');return}
 profile=p;
 const {data:c,error:ce}=await supabase.from('companies').select('id,name,status').eq('id',p.company_id).maybeSingle();
 if(ce||!c){$('content').innerHTML='<div class="panel"><h2>Empresa não encontrada</h2><p>Confira o vínculo da conta com uma empresa ativa.</p></div>';return}
 company=c;$('company-name').textContent=c.name;$('user-role').textContent=({platform_admin:'Administrador da plataforma',company_admin:'Administrador da empresa',manager:'Gestor',operator:'Operador',customer:'Cliente'})[p.role]||p.role||'Usuário';
 try{await loadAll();render()}catch(e){$('content').innerHTML=`<div class="panel"><h2>Não foi possível carregar os dados</h2><p class="error">${esc(e.message)}</p><button class="btn" id="retry">Tentar novamente</button></div>`}
}
async function loadTable(table,order='created_at'){
 // company_id é filtrado explicitamente como defesa em profundidade; RLS continua obrigatório.
 let q=supabase.from(table).select('*').eq('company_id',profile.company_id).limit(500);
 if(order)q=q.order(order,{ascending:false});
 const {data,error}=await q;
 if(error)throw new Error(`${table}: ${error.message}`);
 return data||[];
}
async function loadAll(){
 const specs=[['customers','customers'],['plants','solar_plants'],['generation','generation_records'],['bills','energy_bills'],['tickets','support_tickets'],['leads','leads']];
 for(const [key,table] of specs)cache[key]=await loadTable(table);
}
function dashboard(){
 const kwh=cache.generation.reduce((s,x)=>s+Number(x.generated_kwh||0),0);
 const savings=cache.bills.reduce((s,x)=>s+Number(x.estimated_savings||0),0);
 const open=cache.tickets.filter(x=>!['resolved','closed'].includes(x.status)).length;
 const metrics=[['Clientes',cache.customers.length],['Usinas',cache.plants.length],['Geração registrada',`${num(kwh)} kWh`],['Economia estimada',money(savings)]];
 return `${pageHead('RESUMO OPERACIONAL','Visão geral','Indicadores calculados a partir dos registros disponíveis.')}
 <div class="note">Os números representam registros encontrados no banco da empresa. A geração e a economia dependem da qualidade e da completude dos dados cadastrados.</div>
 <div class="cards">${metrics.map(([l,v])=>`<div class="card metric"><div class="metric-label">${l}</div><div class="metric-value">${v}</div><div class="muted">Dados registrados</div></div>`).join('')}</div>
 <div class="panel"><h2>Resumo da operação</h2><div class="cards" style="margin:0"><div><div class="muted">Chamados em aberto</div><div class="metric-value">${num(open)}</div></div><div><div class="muted">Leads no CRM</div><div class="metric-value">${num(cache.leads.length)}</div></div><div><div class="muted">Faturas</div><div class="metric-value">${num(cache.bills.length)}</div></div><div><div class="muted">Status da empresa</div><div class="metric-value" style="font-size:18px">${esc(company.status||'—')}</div></div></div></div>
 <div class="panel"><h2>Próximas melhorias</h2><p class="muted">Monitoramento por API de inversores, metas de geração, alertas automáticos e relatórios exportáveis dependem da configuração das fontes de dados e das integrações correspondentes.</p></div>`;
}
const columns={
 customers:[['Cliente',r=>r.name],['E-mail',r=>r.email],['Telefone',r=>r.phone],['Concessionária',r=>r.utility_name],['Status',r=>r.status,'status']],
 plants:[['Usina',r=>r.name],['Cliente',r=>cache.customers.find(c=>c.id===r.customer_id)?.name||'—'],['Potência',r=>r.installed_capacity_kwp?num(r.installed_capacity_kwp)+' kWp':'—'],['Inversor',r=>r.inverter_brand],['Status',r=>r.status,'status']],
 bills:[['Cliente',r=>cache.customers.find(c=>c.id===r.customer_id)?.name||'—'],['Referência',r=>r.bill_reference],['Concessionária',r=>r.utility_name],['Consumo',r=>num(r.consumption_kwh)+' kWh'],['Valor pago',r=>money(r.amount_paid)],['Economia estimada',r=>money(r.estimated_savings)]],
 tickets:[['Protocolo',r=>String(r.id||'').slice(0,8).toUpperCase()],['Assunto',r=>r.subject],['Prioridade',r=>r.priority],['Status',r=>r.status,'status'],['Abertura',r=>date(r.created_at)],['Ação',r=>r.status,'ticket']],
 leads:[['Lead',r=>r.name],['E-mail',r=>r.email],['Telefone',r=>r.phone],['Origem',r=>r.source],['Etapa',r=>r.stage,'status'],['Valor mensal estimado',r=>money(r.estimated_monthly_value)]],
 generation:[['Usina',r=>cache.plants.find(p=>p.id===r.solar_plant_id)?.name||'—'],['Período inicial',r=>date(r.period_start)],['Período final',r=>date(r.period_end)],['Geração',r=>num(r.generated_kwh)+' kWh'],['Fonte',r=>r.source]]
};
const config={
 customer:{title:'Cadastrar cliente',table:'customers',fields:[['name','Nome / razão social','text',true],['email','E-mail','email',false],['phone','Telefone','tel',false],['utility_name','Concessionária','text',false],['status','Status','select',true,['active','Ativo'],['inactive','Inativo']] ]},
 plant:{title:'Cadastrar usina',table:'solar_plants',fields:[['name','Nome da usina','text',true],['customer_id','Cliente','customer',true],['installed_capacity_kwp','Potência instalada (kWp)','number',false],['inverter_brand','Fabricante do inversor','text',false]]},
 bill:{title:'Registrar fatura',table:'energy_bills',fields:[['customer_id','Cliente','customer',true],['bill_reference','Referência','text',true],['utility_name','Concessionária','text',false],['consumption_kwh','Consumo (kWh)','number',false],['amount_paid','Valor pago (R$)','number',false],['estimated_savings','Economia estimada (R$)','number',false]]},
 ticket:{title:'Abrir chamado',table:'support_tickets',fields:[['subject','Assunto','text',true],['description','Descrição','textarea',true],['priority','Prioridade','select',true,['low','Baixa'],['normal','Normal'],['high','Alta'],['urgent','Urgente']]]},
 lead:{title:'Cadastrar lead',table:'leads',fields:[['name','Nome / empresa','text',true],['email','E-mail','email',false],['phone','Telefone','tel',false],['source','Origem','text',false],['estimated_monthly_value','Valor mensal potencial (R$)','number',false]]}
};
function inputHtml(f){
 const [name,label,type,required,...opts]=f;let control='';
 if(type==='customer')control=`<select name="${name}" ${required?'required':''}><option value="">Selecione...</option>${cache.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>`;
 else if(type==='select')control=`<select name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
 else if(type==='textarea')control=`<textarea name="${name}" ${required?'required':''}></textarea>`;
 else control=`<input name="${name}" type="${type}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}>`;
 return `<label>${label}${control}</label>`;
}
function tablePage(key,title,desc){
 const cols=columns[key]||[];const rows=cache[key]||[];
 const term=search.toLowerCase();
 const filtered=rows.filter(r=>cols.some(c=>String(c[1](r)??'').toLowerCase().includes(term)));
 return `${pageHead('GESTÃO',title,desc,key==='generation'?'':'${key}')}`.replace('${key}','')+
 `<div class="panel"><div class="toolbar"><input id="search-field" class="field" placeholder="Pesquisar registros..." value="${esc(search)}"><span class="muted">${filtered.length} registro(s)</span></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${filtered.length?filtered.map(r=>`<tr>${cols.map(c=>`<td>${c[2]==='status'?status(c[1](r)):c[2]==='ticket'?`<button class="btn" data-ticket="${esc(r.id)}" data-status="${esc(r.status)}">Avançar status</button>`:esc(c[1](r)??'—')}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${cols.length}">Nenhum registro encontrado.</td></tr>`}</tbody></table></div></div>`;
}
function render(){
 const labels={dashboard:'Visão geral',customers:'Clientes',plants:'Usinas',bills:'Faturas',generation:'Geração',tickets:'Chamados',leads:'CRM / Leads',reports:'Relatórios',settings:'Configurações'};
 if(['customers','plants','bills','tickets','leads'].includes(page))$('content').innerHTML=tablePage(page,labels[page],({customers:'Cadastro e relacionamento com clientes.',plants:'Instalações e potência cadastrada.',bills:'Faturas, consumo e valores registrados.',tickets:'Acompanhamento de solicitações.',leads:'Oportunidades comerciais.'})[page]);
 else if(page==='generation')$('content').innerHTML=tablePage(page,labels[page],'Histórico de geração lançado no banco.');
 else if(page==='reports')$('content').innerHTML=`${pageHead('INTELIGÊNCIA','Relatórios','Resumo dos dados disponíveis na empresa.')}<div class="panel"><h2>Exportação</h2><p class="muted">A exportação de relatórios será adicionada após validar os campos e as regras de acesso de cada conjunto de dados.</p><button class="btn" id="export-csv">Exportar clientes CSV</button></div>`;
 else if(page==='settings')$('content').innerHTML=`${pageHead('ADMINISTRAÇÃO','Configurações','Informações do seu ambiente.')}<div class="panel"><h2>Empresa</h2><p><strong>${esc(company.name)}</strong></p><p class="muted">Status: ${esc(company.status||'—')}</p><p class="muted">Perfil: ${esc(profile.role||'—')}</p><p class="muted">As permissões efetivas também são aplicadas no banco de dados.</p></div>`;
 else $('content').innerHTML=dashboard();
 $('breadcrumb').textContent='Workspace / '+(labels[page]||'Visão geral');
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const sf=$('search-field');if(sf)sf.addEventListener('input',()=>{search=sf.value;render();const n=$('search-field');n?.focus();n?.setSelectionRange(search.length,search.length)});
}
function openModal(type){
 if(type==='plant'&&!cache.customers.length){toast('Cadastre um cliente antes de cadastrar a usina.');return}
 if(type==='bill'&&!cache.customers.length){toast('Cadastre um cliente antes de registrar uma fatura.');return}
 currentType=type;const c=config[type];$('modal-title').textContent=c.title;$('form-fields').innerHTML=c.fields.map(inputHtml).join('');err('form-error','');$('modal-backdrop').classList.add('open');
}
function closeModal(){$('modal-backdrop').classList.remove('open')}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();err('login-error','');if(!configured){err('login-error','Configure as credenciais do Supabase no código antes de publicar.');return}const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){err('login-error','Não foi possível entrar: '+error.message);return}user=data.user;await loadProfileAndApp()});
$('forgot').addEventListener('click',async()=>{if(!configured){err('login-error','Configure as credenciais do Supabase primeiro.');return}const email=$('email').value.trim();if(!email){err('login-error','Informe seu e-mail para receber o link de recuperação.');return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin});err('login-error',error?error.message:'Se o e-mail estiver cadastrado, você receberá instruções para redefinir a senha.')});
$('logout').addEventListener('click',async()=>{await supabase.auth.signOut();user=profile=company=null;setLoggedIn(false)});
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;search='';$('sidebar').classList.remove('open');render()});
$('mobile-menu').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
$('content').addEventListener('click',async e=>{
 const n=e.target.closest('[data-new]');if(n){openModal(n.dataset.new);return}
 const t=e.target.closest('[data-ticket]');if(t){const states=['open','in_progress','waiting_customer','resolved','closed'];const next=states[(states.indexOf(t.dataset.status)+1)%states.length];const {error}=await supabase.from('support_tickets').update({status:next}).eq('id',t.dataset.ticket).eq('company_id',profile.company_id);if(error){toast('Erro ao atualizar: '+error.message);return}await loadAll();render();toast('Status atualizado.');return}
 if(e.target.id==='retry'){await loadProfileAndApp();return}
 if(e.target.id==='export-csv'){const rows=cache.customers;const keys=['name','email','phone','utility_name','status'];const csv=[keys.join(';'),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='solara-clientes.csv';a.click();URL.revokeObjectURL(a.href)}
});
$('modal-close').addEventListener('click',closeModal);$('modal-cancel').addEventListener('click',closeModal);
$('record-form').addEventListener('submit',async e=>{
 e.preventDefault();err('form-error','');const button=e.submitter;button.disabled=true;
 try{
  const raw=Object.fromEntries(new FormData(e.currentTarget).entries());
  for(const k of Object.keys(raw))if(raw[k]==='')raw[k]=null;
  const numeric=['installed_capacity_kwp','consumption_kwh','amount_paid','estimated_savings','estimated_monthly_value'];for(const k of numeric)if(raw[k]!==null)raw[k]=Number(raw[k]);
  const cfg=config[currentType];const payload={...raw,company_id:profile.company_id};
  if(currentType==='plant'){payload.status='active';payload.inverter_integration='manual'}
  if(currentType==='bill'){payload.consumption_kwh=Number(payload.consumption_kwh||0);payload.amount_paid=Number(payload.amount_paid||0);payload.estimated_savings=Number(payload.estimated_savings||0)}
  if(currentType==='ticket'){payload.created_by=user.id;payload.status='open';payload.priority=payload.priority||'normal'}
  if(currentType==='lead')payload.stage='new';
  const {error}=await supabase.from(cfg.table).insert(payload);if(error)throw error;
  closeModal();await loadAll();render();toast('Cadastro salvo.');
 }catch(ex){err('form-error',ex.message||'Não foi possível salvar.');}
 finally{button.disabled=false}
});
supabase.auth.onAuthStateChange((_event,session)=>{if(!session){user=null;profile=null;company=null;setLoggedIn(false)}});
boot();
</script>
</body>
</html>
